# Construire et publier sur GitHub Pages, à chaque poussée sur main.
#
# La construction se fait ici et non chez l'hébergeur : GitHub Pages ne
# sait que servir des fichiers. C'est exactement ce que le site produit
# — `output: "export"` écrit un dossier `out/` de HTML, de CSS et de SVG,
# sans une seule fonction.
#
# `NEXT_PUBLIC_BASE_PATH` est déduite du nom du dépôt. Un site de projet
# est servi sous ce nom, pas à la racine du domaine : sans ce préfixe,
# les liens et les feuilles de style pointeraient vers la racine de
# sulianbh.github.io et rien ne fonctionnerait.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Les actions sont épinglées par empreinte de commit et non par
# étiquette. Une étiquette se déplace : `@v4` désigne aujourd'hui un
# commit, demain un autre, et ce job détient `pages: write` et
# `id-token: write` — de quoi publier le site et signer une identité.
# Le commentaire garde l'étiquette lisible ; c'est l'empreinte qui
# s'exécute.
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, et on n'annule pas celle qui est en cours :
# une interruption en plein déploiement laisse le site à moitié écrit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Les vérifications de rendu, sur une construction ordinaire.
  #
  # Elles ne tournaient nulle part. Les cinq scripts qui les portent
  # importaient Playwright par un chemin absolu vers un cache npx : ils
  # ne fonctionnaient que sur la machine où ils avaient été écrits, et
  # le workflow ne les appelait pas. Tout l'argument qualité du dépôt
  # reposait donc sur des outils qu'aucune machine n'exécutait
  # automatiquement.
  #
  # La construction est ici la construction *ordinaire*, sans
  # `EXPORT_STATIQUE` ni préfixe : les scripts attendent un site servi à
  # la racine par `next start`. C'est la même source que celle publiée,
  # et c'est ce qu'on veut vérifier — la mise en page, les liens, le
  # clavier, le poids ne dépendent pas du mode d'export.
  # ------------------------------------------------------------------
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer
        run: npm ci

      # Le paquet npm n'apporte pas les navigateurs : il faut les
      # télécharger, et seulement Chromium — les scripts n'en ouvrent
      # pas d'autre.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Construire pour la vérification
        run: npm run build

      # Servir et vérifier dans la même étape : un processus lancé en
      # arrière-plan dans une étape précédente ne survit pas de façon
      # garantie à la suivante. L'attente se fait à la boucle et au
      # `curl` plutôt qu'avec un paquet d'attente — en installer un
      # rejouerait la dépendance non déclarée qu'on vient de supprimer.
      - name: Vérifier le rendu
        run: |
          npm run start &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3011/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:3011/ || {
            echo "::error::le serveur n'a pas répondu sur le port 3011"
            exit 1
          }
          npm run verifier:rendu

  construire:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer
        run: npm ci

      # Sans `enablement: true`, volontairement. Le jeton d'Actions n'a
      # pas le droit de *créer* un site Pages — l'étape échoue avec
      # « Resource not accessible by integration », et c'est ce qui a
      # fait tomber la première exécution. Pages a donc été activé une
      # fois par l'API avec un jeton d'utilisateur (`POST /repos/.../pages`,
      # `build_type: workflow`) ; cette étape ne fait plus que le lire.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Vérifier
        run: npm run lint && npm run typographie && npm run coherence

      - name: Construire
        run: npm run build
        env:
          # Ces trois variables ne sont posées qu'ici : en local le
          # site se construit comme avant, pour `next start`.
          # `EXPORT_STATIQUE` écrit un dossier `out/` de fichiers plats,
          # seule chose que GitHub Pages sache servir.
          EXPORT_STATIQUE: oui
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # L'artefact qui part réellement chez GitHub n'était relu par
      # personne. Les cinq scripts de rendu tournent dans le job
      # `verifier`, sur une construction ordinaire : sans export, sans
      # préfixe, servie à la racine par `next start`. Tout ce qui ne se
      # casse qu'à cause du préfixe leur échappe donc par construction —
      # c'est là qu'a vécu, une journée entière, la carte de partage de
      # ce site, dont l'og:image annonçait `…/Site-12/Site-12/partage.png`
      # et qui n'a été vue que sur le site en ligne.
      #
      # Cette étape ne pouvait pas vivre dans `verifier` : il n'y a pas de
      # dossier `out/` là-bas, et en poser un reviendrait à construire une
      # troisième fois. Elle se place donc ici, entre la construction qui
      # produit l'artefact et le dépôt qui l'emporte, avec les mêmes
      # variables : elle relit sur le disque les fichiers qui vont
      # réellement partir. Ni navigateur, ni serveur, ni réseau.
      - name: Relire l'export
        run: npm run export
        env:
          EXPORT_STATIQUE: oui
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # Jekyll ignore les dossiers commençant par un souligné, et tout
      # ce que Next produit vit dans `_next`. Le dépôt d'artefact ne
      # passe pas par Jekyll, mais le fichier ne coûte rien et protège
      # d'une bascule vers la publication par branche.
      - name: Neutraliser Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
